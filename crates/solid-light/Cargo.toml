[package]
name = "solid-light"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Light Protocol CPI integration for SolID credential trees"

[lib]
crate-type = ["lib"]

[dependencies]
anchor-lang = { workspace = true }
borsh = "0.10"
hex = "0.4"
# SOLID-SEC-059 / H1 closure: on-chain Poseidon-Merkle recompute uses
# `solid_core::poseidon::hash_bytes` (dual-target: BPF sol_poseidon
# syscall, host light-poseidon).  The cycle is broken because solid-core
# does not depend on solid-light.
solid-core = { path = "../solid-core" }
# SEC-048 Phase E.1 (2026-05-XX): on-chain Groth16 verify primitives.
# Lifted out of `programs/zk-verifier/src/lib.rs` so a second consumer
# (`programs/issuer-registry`'s `register_issuer` subgroup verify) can
# share the same syscall-driven path without duplicating ~150 lines of
# cryptographic code across programs.  Const-generic over the public-
# input count `N`; see `groth16.rs`.
groth16-solana = "0.2"
