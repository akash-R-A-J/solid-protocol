# ─────────────────────────────────────────────────────────────────────────────
# `solid-prover` lives in its own workspace because `ark-circom 0.5.0-alpha`
# hard-pins `num-bigint = 0.4.3`, which conflicts with the `num-bigint`
# version pulled by `groth16-solana` in the main (programs) workspace.
#
# The two dependency graphs are genuinely incompatible — this is not a
# workaround, it is the Cargo-idiomatic way to express "different tool, different
# dep closure".  CI exercises BOTH workspaces.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]
members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[package]
name = "solid-prover"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
solid-core = { path = "../../crates/solid-core" }
ark-bn254    = "0.4"
ark-ff       = "0.4"
ark-groth16  = "0.4"
ark-relations = "0.4"
ark-serialize = "0.4"
ark-std      = "0.4"
ark-circom   = "0.5.0-alpha"
ark-snark    = "0.4"
sha2         = "0.10"
thiserror    = "1.0"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
hex          = "0.4"
rand         = "0.8"
num-bigint   = { version = "0.4", features = ["serde", "rand"] }

[dev-dependencies]
anyhow = "1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
