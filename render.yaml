services:
  - type: web
    name: solid-indexer-devnet
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm --prefix ts-sdk ci && npm --prefix ts-sdk run build && npm install --prefix indexer && npm test --prefix indexer
    startCommand: npm start --prefix indexer
    disk:
      name: solid-indexer-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: SOLID_MANIFEST_PATH
        value: /opt/render/project/src/deployments/devnet.json
      - key: SOLID_INDEXER_STORE_PATH
        value: /var/data/solid-indexer/state.json
      - key: SOLID_RPC_URL
        value: https://api.devnet.solana.com
      - key: SOLID_INDEXER_WRITE_TOKEN
        sync: false
