[package]
name = "issuer-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "issuer_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# SEC-048 closure (Phase E, 2026-05-XX): the `sec007-skip-onchain`
# escape hatch was REMOVED.  `register_issuer` now consumes a Groth16
# proof of the prime-order-subgroup invariant (`[r] * P == identity`)
# via the small subgroup circuit at `circuits/bjj_subgroup_proof.circom`;
# on-chain `solid_light::groth16::verify_groth16_proof::<2>` is the
# load-bearing soundness gate at registration time.  Invalid keys never
# enter the registry.  CI gate (SEC-081) prevents the feature name from
# being reintroduced; SECURITY_REGISTRY.md SEC-048 has the full closure
# narrative.

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
# Shared on-chain helpers: SCHEMA_REGISTRY_ID, SchemaTreeBinding parser,
# Groth16 verify primitives (SEC-048 Phase E.1).  solid-light is
# BPF-compatible (same dep graph as zk-verifier).
solid-light = { path = "../../crates/solid-light" }
# `SchemaAccount` typed re-use (SOLID-SEC-003).  `no-entrypoint` pulls
# in only the lib — never the BPF entry — so anchor builds a single
# program binary per crate.
schema-registry = { path = "../schema-registry", features = ["no-entrypoint"] }
# On-chain Poseidon for `compute_issuer_leaf` (ADR-0014).  solid-core
# is the same crate schema-registry depends on; same BPF-compat
# guarantees.
solid-core = { path = "../../crates/solid-core" }

[dev-dependencies]
# Host-only deps for the SEC-048 Phase E.3 round-trip integration test
# (`subgroup_host_verify_round_trip` in src/lib.rs::tests).  Mirrors
# zk-verifier's matching dev-deps for `groth16_host_verify_round_trip`.
serde_json = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
