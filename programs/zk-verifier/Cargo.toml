[package]
name = "zk-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "zk_verifier"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
groth16-solana = "0.2"
solid-light = { path = "../../crates/solid-light" }

[dev-dependencies]
# Host-only deps for the Groth16 round-trip integration test
# (groth16_host_verify_round_trip in src/lib.rs::tests).
serde_json = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
