# Top-level toolchain pin for the main workspace (programs + crates + wasm).
#
# CLAUDE.md "Toolchain pins" lists rust 1.79.0 as the project pin; until now
# that pin lived only as a `rustup override` in `~/.rustup/settings.toml`,
# which is host-local and invisible to rust-analyzer's proc-macro server.
# The result was a recurring ABI mismatch in IDEs:
#
#   proc macro server error: Cannot create expander for
#   target/debug/deps/libserde_derive-*.dylib:
#   mismatched ABI expected: rustc 1.95.0, got rustc 1.79.0
#
# i.e. cargo built `serde_derive.dylib` with the override (1.79.0) but
# rust-analyzer's expander was launched with rustup's *default* toolchain
# (1.95.0). Committing the pin here makes rust-analyzer see the project
# requirement and use the matching toolchain for proc-macro expansion.
#
# `tools/solid-prover/rust-toolchain.toml` is intentionally left in place
# because that crate is a separate workspace (different dep closure;
# ark-circom hard-pins num-bigint 0.4.3) and may need its own pin if the
# top-level pin diverges.
[toolchain]
channel = "1.79.0"
components = ["rustfmt", "clippy", "rust-src"]
targets = ["wasm32-unknown-unknown"]
