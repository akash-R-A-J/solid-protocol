[package]
name = "solid-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bridge for SolID Protocol — exposes solid-core crypto to JavaScript/TypeScript"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solid-core = { path = "../crates/solid-core" }
# wasm-bindgen ecosystem pinned to <=0.2.100 because newer releases (0.2.118+)
# raise wasm-bindgen-cli MSRV to rustc 1.86, which conflicts with our pinned
# 1.79.0 toolchain (Anchor 0.30.1 + solana-cli 1.18.22 baseline). 0.2.100 is
# the last 0.2.x line that supports rustc 1.76+. See docs/E2E_BLOCKERS.md B6.
wasm-bindgen = "=0.2.100"
serde-wasm-bindgen = "=0.6.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "=0.3.77"
console_error_panic_hook = "=0.1.7"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.50"
