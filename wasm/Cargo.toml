[package]
name = "solid-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bridge for SolID Protocol — exposes solid-core crypto to JavaScript/TypeScript"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
solid-core = { path = "../crates/solid-core" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
once_cell = "1.21.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
