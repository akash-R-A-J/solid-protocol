[workspace]
resolver = "2"
members = [
    "crates/solid-core",
    "crates/solid-light",
    "programs/zk-verifier",
    "programs/issuer-registry",
    "programs/schema-registry",
    "wasm",
]
# `solid-prover` is an off-chain utility that pulls `ark-circom`, whose
# `num-bigint = 0.4.3` hard-pin conflicts with `groth16-solana`'s `num-bigint`
# version in the on-chain graph. It lives outside the default workspace and is
# built standalone via `cargo build --manifest-path crates/solid-prover/Cargo.toml`.
exclude = ["crates/solid-prover"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde", "rand"] }
num-traits = "0.2"
ark-bn254 = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-ed-on-bn254 = "0.4"
ark-std = "0.4"
rand = "0.8"
hex = "0.4"
thiserror = "1.0"
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
ark-groth16 = "0.4"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
